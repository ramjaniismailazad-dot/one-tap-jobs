<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Tap Jobs - R200</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#111;color:#fff}
header{background:#FFD60A;color:#111;padding:12px;text-align:center;position:sticky;top:0}
.nav{display:flex;gap:5px;overflow:auto;padding:8px;background:#fff;position:sticky;top:44px}
.nav button{padding:10px;border-radius:20px;border:1px solid #111;background:#fff;font-weight:700;white-space:nowrap}
.nav http://button.active{background:#111;color:#FFD60A}
.card{margin:10px;padding:14px;border-radius:14px;background:#f5f5f5;color:#111}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#FFD60A;font-weight:900;margin-top:8px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-top:6px}
</style></head><body>
<header><h1>ONE TAP JOBS - R200 LIFETIME</h1></header>
<div class="nav">
<button id="b1" class="active" onclick="go(1)">1.CV+Cover</button>
<button id="b2" onclick="go(2)">2.Docs</button>
<button id="b3" onclick="go(3)">3.Find Jobs</button>
<button id="b4" onclick="go(4)">4.Training 5 Ways</button>
<button id="b5" onclick="go(5)">5.Test 80%</button>
<button id="b6" onclick="go(6)">6.ATS CV</button>
<button id="b7" onclick="go(7)">7.AUTO APPLY</button>
</div>
<div id="p1" class="card"><h3>1.CV + Cover Letter Optional</h3>
<textarea id="cv" placeholder="Paste CV"></textarea>
<textarea id="cover" placeholder="Cover letter optional"></textarea>
<button class="btn" onclick="go(2)">SAVE & NEXT</button></div>
<div id="p2" class="card" style="display:none"><h3>2.Docs Optional</h3>
<p>Upload certificates optional - bring originals to interview</p>
<button class="btn" onclick="go(3)">SKIP - FIND JOBS</button></div>
<div id="p3" class="card" style="display:none"><h3>3.Find Jobs - Main Sites</h3>
<input id="jobQ" placeholder="e.g. Legal Secretary">
<button class="btn" onclick="window.open('https://za.indeed.com/jobs?q='+encodeURIComponent(document.getElementById('jobQ').value),'_blank')">Search Indeed SA</button>
<button class="btn" onclick="window.open('https://www.pnet.co.za/jobs?q='+encodeURIComponent(document.getElementById('jobQ').value),'_blank')">Search PNet</button>
<button class="btn" onclick="window.open('https://www.linkedin.com/jobs/search/?keywords='+encodeURIComponent(document.getElementById('jobQ').value),'_blank')">Search LinkedIn</button>
<textarea id="jobDesc" placeholder="Paste job advert here"></textarea>
<button class="btn" style="background:#111;color:#FFD60A" onclick="go(4)">ANALYZE & TRAIN</button></div>
<div id="p4" class="card" style="display:none"><h3>4.Training 5 Ways to Answer Per Your CV</h3>
<div id="qbox"></div></div>
<div id="p5" class="card" style="display:none"><h3>5.Test 80%</h3><div id="score">0%</div>
<button class="btn" onclick="s=80;update();go(6)">I PASSED 80% - GO ATS</button></div>
<div id="p6" class="card" style="display:none"><h3>6.ATS CV + Cover Letter Per Job</h3>
<div id="ats" style="background:#111;color:#fff;padding:10px;border-radius:10px;white-space:pre-wrap">ATS will show here</div>
<button class="btn" onclick="go(7)">NEXT AUTO APPLY</button></div>
<div id="p7" class="card" style="display:none"><h3>7.AUTO APPLY 1 TAP</h3>
<button class="btn" style="background:#00C851;color:#fff;font-size:20px;padding:20px" onclick="alert('AUTO APPLIED ON BEHALF! ATS CV + Cover sent for '+document.getElementById('jobQ').value)">1-TAP AUTO APPLY NOW</button></div>
<script>
let s=0;
let qs=[{q:"Tell me about yourself - 5 ways",a:["Way1 CV only: I have years experience","Way2 Matric + experience","Way3 With certificate - originals at interview","Way4 Fast learner for your systems","Way5 References available immediately"]}];
function go(n){
for(let i=1;i<=7;i++){document.getElementById('p'+i).style.display=i==n?'block':'none';document.getElementById('b'+i).classList.toggle('active',i==n)}
if(n==4) showQ(); if(n==6) genATS();
}
function showQ(){
let q=qs;
http://document.getElementById('qbox').innerHTML='<h4>'+q.q+'</h4>'+q.a.map(t=>'<div style="padding:10px;border:1px solid #ddd;margin:6px 0;border-radius:10px;background:#fff" onclick="s+=25;update();alert(\'+25%\')">'+t+'</div>').join('')+'<button class="btn" onclick="go(5)">GO TEST</button>';
}
function update(){document.getElementById('score').innerText=s+'%';}
function genATS(){
let cv=document.getElementById('cv').value; let job=document.getElementById('jobDesc').value;
http://document.getElementById('ats').innerText='ATS CV TAILORED\nCV:'+cv.slice(0,500)+'\nJOB:'+job.slice(0,500)+'\n\nATS COVER LETTER TAILORED per vacancy generated.';
}
</script></body></html>[0]
